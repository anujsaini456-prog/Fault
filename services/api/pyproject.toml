[project]
name = "fault-sigma-api"
version = "0.1.0"
description = "Fault Sigma API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "pyotp>=2.9",
  "segno>=1.6",
  "cryptography>=43",
  "redis>=5.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: needs a running Postgres (FS_TEST_* env vars)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "E501"]
"alembic/versions/*" = ["E501"]  # long SQL reads better unwrapped

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs ORM code inside greenlets; without this, coverage misses it.
concurrency = ["greenlet", "thread"]
source = ["app"]
omit = ["app/seed.py"]
